# cargo-about settings for the two WebAssembly programs (docxtor-wasm, docxtor-spell).
# `accepted` is the licence allow-list: cargo about fails on a crate whose licence is not in it. Keep it equal to ALLOWED in
# scripts/notices.mjs.
accepted = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "MPL-2.0", "OFL-1.1", "Unicode-3.0", "CC0-1.0", "Apache-2.0 WITH LLVM-exception"]
targets = ["wasm32-unknown-unknown"]
ignore-dev-dependencies = true
ignore-build-dependencies = true
