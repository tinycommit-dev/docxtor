name: Nightly Word checks

# Word itself is not available, so compatibility is checked by two programs, as gates that fail:
#   1. Microsoft's Open XML SDK validator (tools/ooxml-validate, scripts/validate.mjs): Docxtor must add no error the
#      original lacks and that scripts/validate-allow.json does not name; files Docxtor makes from nothing must have none.
#   2. LibreOffice (scripts/lo-check.mjs): the text of a PDF of Docxtor's save must equal the original's, the page count
#      too (2 percent beyond 50 pages), unless scripts/lo-allow.json names the file.
# Both run on the pinned sample of 100 public files (scripts/corpus.mjs) and on the feature files: one saved file per op
# kind and per recorded shape, and built documents (crates/docxtor-core/tests/common/features.rs).
# The quick part (the feature files and the fixtures through the validator) also runs in ci.yml.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  word-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # A gate must not pass because a tool is missing.
      DOCXTOR_REQUIRE: "1"
      DOCXTOR_CORPUS_DIR: ${{ github.workspace }}/.corpus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (the version rust-toolchain.toml names)
        run: |
          rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x
      - name: LibreOffice and poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils fonts-liberation fonts-dejavu-core fonts-crosextra-carlito fonts-crosextra-caladea
          soffice --version
          pdftotext -v
      - name: The public test files (pinned), cached on the list that pins them
        id: corpus-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .corpus
          key: corpus-${{ hashFiles('scripts/corpus.mjs') }}
      - name: Fetch the corpus
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        run: npm run corpus:fetch
      - name: Build the docxtor command
        run: cargo build --profile gate -q -p docxtor-cli
      - name: Make the feature files
        run: DOCXTOR_FEATURES_OUT="$RUNNER_TEMP/features" cargo test --profile gate -q -p docxtor-core --test random_ops feature_files -- --nocapture
      - name: Open XML validator gate
        env:
          DOCXTOR_FEATURES_DIR: ${{ runner.temp }}/features
          DOCXTOR_VALIDATE_OUT: ${{ runner.temp }}/validate.json
        run: npm run corpus:validate
      - name: LibreOffice gate
        env:
          DOCXTOR_FEATURES_DIR: ${{ runner.temp }}/features
          DOCXTOR_LO_OUT: ${{ runner.temp }}/lo-check.json
        run: npm run corpus:lo
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: word-check-reports
          path: |
            ${{ runner.temp }}/validate.json
            ${{ runner.temp }}/lo-check.json
          retention-days: 14
          if-no-files-found: ignore
