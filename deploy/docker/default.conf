# The web server of the docxtor-web image (deploy/Dockerfile): the built app on port 8080, as the unprivileged nginx user.
# The security headers and caching rules are not written here: /etc/nginx/docxtor-headers.conf is deploy/nginx.conf, generated from
# deploy/_headers (scripts/headers.mjs), the same rules Cloudflare Pages sends.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # The engine (WebAssembly) is the biggest file. nginx's own list of types sends it as application/wasm; the spelling dictionaries (.aff, .dic)
    # have no type there and go out as application/octet-stream, which the app does not mind (it reads them as bytes).
    # Files are compressed once, at build time (deploy/Dockerfile), and sent as they are to a browser that accepts gzip; anything else
    # compressible is compressed on the way out. Brotli is not part of the official nginx.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/wasm text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml text/plain application/xml;

    # For a health check: always 200, plain text, never cached.
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    include /etc/nginx/docxtor-headers.conf;
}
